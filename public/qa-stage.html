<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Conferência visual do palco</title><style>body{margin:0;background:#152b3a;color:white;font:16px Arial}header{display:flex;gap:16px;padding:15px;align-items:center}button{padding:10px}iframe{display:block;width:min(100%,1280px);height:auto;aspect-ratio:16/9;border:0;margin:auto}</style><header>Prévia local · dados de demonstração <button onclick="show(5)">5 participantes</button><button onclick="show(10)">10 participantes</button><button onclick="donate()">Testar alerta</button></header><iframe title="Palco para conferência" src="/static/index.html?preview=1"></iframe><script>const f=document.querySelector('iframe');const names=['Gabriel Programador','Ana Luiza','Lucas','Bia','Rafael','Marina','João','Camila','Pixel','Kirito'];function show(n){f.contentWindow.postMessage({type:'stage-state',state:{quality:'fullhd',participants:names.slice(0,n).map((display_name,i)=>({id:'qa-'+i,display_name,role:'participante',messages:20-i})),entry_animation:'current',exit_animation:'current'}},location.origin)}function donate(){f.contentWindow.postMessage({type:'stage-state',state:{events:[{id:crypto.randomUUID(),donor_name:'Apoiador de teste',amount:10,currency:'BRL',message:'Obrigado pela live!'}]}},location.origin)}window.addEventListener('message',e=>{if(e.origin===location.origin&&e.data?.type==='stage-ready')show(5)});</script></html>
